<header class="topbar">
  <div class="topbar-inner">
    <a class="brand mono" href="#inicio">~/marco-rios</a>
    <nav class="nav" aria-label="Navegación principal">
      <a href="#sobre-mi">sobre-mi</a>
      <a href="#experiencia">experiencia</a>
      <a href="#proyectos">proyectos</a>
      <a href="#habilidades">habilidades</a>
      <a href="#contacto">contacto</a>
    </nav>
  </div>
</header>

<main>
  <app-hero />
  <app-about />
  <app-experience />

  <!-- Carga diferida: estas secciones están por debajo del pliegue,
       así que Angular las descarga en un chunk aparte y las renderiza
       cuando entran en el viewport (@defer + on viewport). -->
  @defer (on viewport) {
    <app-projects />
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
  }

  @defer (on viewport) {
    <app-skills />
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
  }

  @defer (on viewport) {
    <app-contact />
  } @placeholder {
    <div class="section-placeholder" aria-hidden="true"></div>
  }
</main>

<footer class="footer">
  <p class="mono">© {{ year }} {{ profile.name }} — hecho con Angular 17 (Standalone + Signals)</p>
</footer>
